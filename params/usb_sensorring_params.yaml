/**:
  ros__parameters:
    pointcloud_sensor:
      base_setup:
        tf_name: "base_sensorring"
        timeout_ms: 1000
        enable_brs: true
        publishers:
          depth_individual: true
          depth_combined: true
          depth_raw: false
        repair_errors: true
        auto_discover: false
        enforce_topology: false
        frequency_tof_hz: 0.0 # max frequency ~ 13.6...14.1 Hz (0.0 -> free running)
        frequency_thermal_hz: 5.0 # max frequency ~ 5.0 Hz
      htpa32_config:
        auto_min_max: true
        use_eeprom_file: true
        use_calibration_file: true
        eeprom_file_dir: ".eduart/sensorring/eeprom"
        calibration_file_dir: ".eduart/sensorring/calibration"
        scale_t_min_deg: 20.0
        scale_t_max_deg: 35.0
        max_rate_hz: 5.0
      vl53l8cx_config:
        max_rate_hz: 15.0
      tmf8829_config:
        resolution_mode: 3 # 0=8x8, 1=8x8LR, 2=8x8HA, 3=16x16, 4=16x16HA, 5=32x32, 6=32x32HA, 7=48x32, 8=48x32HA
        k_iterations: 0
        max_rate_hz: 30.0
      led_config:
        initial_mode: 0 #		Off = 0, Dimmed = 1, HighBeam = 2, FlashAll = 3, FlashLeft = 4, FlashRight = 5, Pulsation = 6, Rotation = 7, Running = 8, MapDistance = 9
        initial_color: [64, 64, 64]
      topology:
        nr_of_interfaces: 1
        interfaces:
          interface_0:
            #interface_type: "usbtingo"
            #interface_name: "0"
            interface_type: "socketcan"
            interface_name: "can0"
            orientation: "left"
            nr_of_sensors: 3
