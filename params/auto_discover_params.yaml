/**:
  ros__parameters:
    pointcloud_sensor:
      base_setup:
        tf_name: "base_sensorring"
        auto_discover: true
        enforce_topology: false
        repair_errors: true
        frequency_tof_hz: 0.0 # 0.0 -> free running at hardware max rate
        frequency_thermal_hz: 5.0 # max frequency ~ 5.0 Hz
        timeout_ms: 1000
        publishers:
          depth_individual: true
          depth_combined: true
          depth_raw: false
      htpa32_config:
        auto_min_max: true
        use_eeprom_file: false
        use_calibration_file: false
        eeprom_file_dir: ""
        calibration_file_dir: ""
        scale_t_min_deg: 20.0
        scale_t_max_deg: 35.0
        max_rate_hz: 5.0
      vl53l8cx_config:
        max_rate_hz: 15.0
      tmf8829_config:
        resolution_mode: 3 # 0=8x8, 1=8x8LR, 2=8x8HA, 3=16x16, 4=16x16HA, 5=32x32, 6=32x32HA, 7=48x32, 8=48x32HA
        k_iterations: 0
        max_rate_hz: 30.0
      led_config:
        initial_mode: 0 # Off
        initial_color: [0, 0, 0]
      topology:
        nr_of_interfaces: 2
        interfaces:
          interface_0:
            interface_type: "socketcan"
            interface_name: "can0"
            enable_brs: false
          interface_1:
            interface_type: "usbtingo"
            interface_name: "0"
            enable_brs: false

