/**:
  ros__parameters:
    pointcloud_sensor:
      base_setup:
        tf_name: "base_sensorring"
        auto_discover: false
        enforce_topology: false
        repair_errors: true
        frequency_tof_hz: 0.0 # max frequency ~ 13.6...14.1 Hz (0.0 -> free running)
        frequency_thermal_hz: 5.0 # max frequency ~ 5.0 Hz
        timeout_ms: 1000
        enable_brs: false
      thermal_config:
        auto_min_max: false
        use_eeprom_file: true
        use_calibration_file: true
        eeprom_file_dir: ".eduart/sensorring/eeprom"
        calibration_file_dir: ".eduart/sensorring/calibration"
        scale_t_min_deg: 20.0
        scale_t_max_deg: 35.0
      led_config:
        initial_mode: 9 #		Off = 0, Dimmed = 1, HighBeam = 2, FlashAll = 3, FlashLeft = 4, FlashRight = 5, Pulsation = 6, Rotation = 7, Running = 8, MapDistance = 9
        initial_color: [64, 64, 64]
      topology:
        nr_of_interfaces: 2
        can_interfaces:
          can_interface_0:
            interface_type: "socketcan"
            interface_name: "eduart-can1"
            orientation: "right"
            nr_of_sensors: 6
            sensors:
              sensor_0: # Headlight front right
                enable_tof: true
                enable_thermal: false
                enable_light : true
                rotation: [-90.0, -19.7, -110.0]
                translation: [0.183, -0.066, 0.044]
              sensor_1: # Taillight rear right
                enable_tof: true
                enable_thermal: false
                enable_light : true
                rotation: [0.0, 90.0, 200.0]
                translation: [-0.180, -0.066, 0.052]

          can_interface_1:
            interface_type: "socketcan"
            interface_name: "eduart-can0"
            orientation: "left"
            nr_of_sensors: 6
            sensors:
              sensor_0: # Headlight front left
                enable_tof: true
                enable_thermal: false
                enable_light : true
                rotation: [90.000, -19.7, 110.0]
                translation: [0.183, 0.066, 0.044]
              sensor_1: # Taillight rear left
                enable_tof: true
                enable_thermal: false
                enable_light : true
                rotation: [0.0, -90.0, -20.0]
                translation: [-0.180, 0.066, 0.052]
