                orientation: "right"
                rotation: [81.563, 0.0, -35.0]
                translation: [0.000, -0.106, 0.106]
              board_3:
                expected_devices: ["any_depth", "any_light"]
                orientation: "right"
                rotation: [90.000, 0.0, 0.0]
                translation: [0.023, -0.108, 0.072]
              board_4:
                expected_devices: ["any_depth", "any_light"]
                orientation: "right"
                rotation: [0.0, 90.0, 200.0]
                translation: [-0.180, -0.066, 0.052]
              board_5:
